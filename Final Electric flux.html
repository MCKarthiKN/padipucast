<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Field & Flux Gaussian Volumes Simulation</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/lemon-milk');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'LEMON MILK', sans-serif;
            touch-action: none;
            color: #fff;
        }

        /* Wrap tabs natively so the 6 new buttons cleanly fit across device screens */
        #mode-tabs {
            position: absolute;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 95%; max-width: 950px;
            gap: 6px;
            z-index: 50;
            background: rgba(15, 15, 15, 0.9);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
            pointer-events: auto;
        }
        .mode-btn {
            background: transparent;
            color: #888;
            border: 1px solid transparent;
            padding: 8px 12px;
            font-family: 'LEMON MILK', sans-serif;
            font-size: 10px;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
            pointer-events: auto;
        }
        .mode-btn:hover { color: #fff; }
        .mode-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid #555;
            box-shadow: 0 0 10px rgba(255,255,255,0.1);
        }

        /* Settings Panel */
        #ui-container {
            position: absolute;
            top: 60px; /* Offset to breathe room under 2nd mode bar line */
            left: 15px;
            display: flex; flex-direction: column; align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }
        #ui-container > * { pointer-events: auto; }
        
        #toggle-btn {
            background: #ffffff; color: #000000; border: none;
            padding: 10px 20px; font-family: 'LEMON MILK', sans-serif;
            font-size: 14px; cursor: pointer; border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); transition: transform 0.2s;
        }
        #toggle-btn:active { transform: scale(0.95); }

        #panel {
            margin-top: 10px; background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(8px); padding: 20px;
            border-radius: 8px; border: 1px solid #333;
            display: flex; flex-direction: column; gap: 20px;
            transition: opacity 0.3s, transform 0.3s; transform-origin: top left;
            width: 310px; box-sizing: border-box;
        }
        #panel.collapsed { opacity: 0; transform: scaleY(0); pointer-events: none; }

        .control-group { display: flex; flex-direction: column; gap: 12px; }
        .control-group label { font-size: 11px; letter-spacing: 1px; color: #aaa; }
        .highlight-label { color: #00aaff !important; font-weight: bold; font-size: 12px !important; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #fff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: #555; border-radius: 2px; }

        .radio-group { display: flex; flex-direction: column; gap: 8px; font-size: 11px; }
        .radio-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff; }
        .toggle-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #444; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ffffff; }
        input:checked + .slider:before { transform: translateX(16px); background-color: #000; }

        /* Flux Toolbox & SVGs */
        #toolbox {
            position: absolute; bottom: 30px; right: 30px;
            display: none; flex-direction: column; align-items: center;
            z-index: 10; cursor: pointer; pointer-events: auto;
        }
        .toolbox-icon {
            width: 72px; height: 72px;
            border: 2px solid #555; border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            display: flex; justify-content: center; align-items: center;
            transition: 0.3s; position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 8px;
        }
        .toolbox-icon svg { transition: 0.3s; }
        
        .draw-obj { stroke: #888; transition: stroke 0.3s; fill: rgba(0,170,255,0.12); }
        .draw-dim { stroke: #555; transition: stroke 0.3s; }
        .draw-txt { fill: #888; font-family: monospace; transition: fill 0.3s; }

        #toolbox.active .toolbox-icon {
            border-color: #ffff00;
            background: rgba(255, 255, 0, 0.08);
            box-shadow: 0 0 20px rgba(255, 255, 0, 0.4), 0 0 40px rgba(255,255,0,0.15);
        }
        #toolbox.active .draw-obj { stroke: #ffff00; fill: rgba(255, 255, 0, 0.12); }
        #toolbox.active .draw-txt { fill: #ffff00; }
        #toolbox.active .draw-dim { stroke: #aaaa00; }

        #toolbox-label { font-size: 10px; letter-spacing: 1.5px; color: #aaa; text-align: center; font-weight: bold;}
        #toolbox.active #toolbox-label { color: #ffff00; }

        #flux-progress {
            position: absolute; bottom: 135px; right: 30px;
            font-size: 16px; color: #ffff00; font-weight: bold;
            display: none; text-shadow: 0 0 10px rgba(255,255,0,0.5);
            pointer-events: none; letter-spacing: 1px;
        }

        #info-label {
            position: absolute; bottom: 160px; right: 30px;
            font-size: 10px; color: #00aaff; display: none;
            pointer-events: none; text-align: right; letter-spacing: 1px;
            line-height: 1.6; text-shadow: 0 0 8px rgba(0, 170, 255, 0.4); font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Expandable Setup TABS -->
    <div id="mode-tabs">
        <button class="mode-btn active" data-mode="CONSTRUCTION">CHARGE CONSTRUCTION</button>
        <button class="mode-btn" data-mode="FLUX_CENTER_PLATES">FLUX: PLATE CENTER (6)</button>
        <button class="mode-btn" data-mode="FLUX_CORNER_PLATES">FLUX: PLATE CORNER (24)</button>
        <button class="mode-btn" data-mode="FLUX_FACE_CUBES">FLUX: CUBE FACE (2)</button>
        <button class="mode-btn" data-mode="FLUX_EDGE_CUBES">FLUX: CUBE EDGE (4)</button>
        <button class="mode-btn" data-mode="FLUX_CORNER_CUBES">FLUX: CUBE CORNER (8)</button>
    </div>

    <!-- Interface Options Panel -->
    <div id="ui-container">
        <button id="toggle-btn">SETTINGS</button>
        <div id="panel">
            <div id="construction-controls">
                <div class="control-group">
                    <label class="highlight-label">CONSTRUCTION STEP (<span id="buildVal">1</span>/17)</label>
                    <input type="range" id="buildSlider" min="1" max="17" step="1" value="1">
                </div>
                <hr style="border: 0.5px solid #333; width: 100%; margin: 15px 0;">
                <div class="control-group">
                    <label>FIELD LINE SETUP</label>
                    <div class="radio-group">
                        <label><input type="radio" name="setupType" value="continuous" checked> LONG CONTINUOUS</label>
                        <label><input type="radio" name="setupType" value="discontinuous"> SHORT DISCONTINUOUS</label>
                    </div>
                </div>
                <div class="control-group" style="margin-top: 10px;">
                    <label>CHARGES PER RING (<span id="countVal">24</span>)</label>
                    <input type="range" id="countSlider" min="4" max="60" step="4" value="24">
                </div>
                <div class="control-group" style="margin-top: 10px;">
                    <label>ARROW LENGTH</label>
                    <input type="range" id="lengthSlider" min="1.0" max="6.0" step="0.1" value="3.5">
                </div>
                <hr style="border: 0.5px solid #333; width: 100%; margin: 15px 0;">
            </div>

            <div class="control-group">
                <div class="toggle-row">
                    <label style="color: #fff; font-size: 11px;">SHOW 3D PLANES</label>
                    <label class="switch"><input type="checkbox" id="planesToggle" checked><span class="slider"></span></label>
                </div>
                <div class="toggle-row" id="isolate-row">
                    <label style="color: #fff; font-size: 11px;">ISOLATE 2D FIELD ON ALIGN</label>
                    <label class="switch"><input type="checkbox" id="isolateToggle"><span class="slider"></span></label>
                </div>
            </div>
        </div>
    </div>

    <!-- Universal SVG Toolbox Controller -->
    <div id="toolbox">
        <!-- SVG Vector for A PLATE Context -->
        <div class="toolbox-icon" id="svg-plate">
            <svg width="52" height="52" viewBox="0 0 52 52">
                <rect x="8" y="8" width="36" height="36" class="draw-obj" stroke-width="2" rx="1"/>
                <!-- Shading reference limits -->
                <line x1="8" y1="20" x2="20" y2="8" class="draw-dim" stroke-width="0.8"/>
                <line x1="8" y1="32" x2="32" y2="8" class="draw-dim" stroke-width="0.8"/>
                <line x1="8" y1="44" x2="44" y2="8" class="draw-dim" stroke-width="0.8"/>
                <line x1="20" y1="44" x2="44" y2="20" class="draw-dim" stroke-width="0.8"/>
                <line x1="32" y1="44" x2="44" y2="32" class="draw-dim" stroke-width="0.8"/>
                
                <line x1="8" y1="4" x2="44" y2="4" class="draw-dim" stroke-width="1"/>
                <text x="26" y="3.5" text-anchor="middle" font-size="6" class="draw-txt" dominant-baseline="auto">a</text>
                
                <line x1="4" y1="8" x2="4" y2="44" class="draw-dim" stroke-width="1"/>
                <text x="4" y="26" text-anchor="middle" font-size="6" class="draw-txt" dominant-baseline="middle" transform="rotate(-90 4 26)">a</text>
            </svg>
        </div>
        <!-- SVG Vector for CUBE VOLUMES Context -->
        <div class="toolbox-icon" id="svg-cube" style="display: none;">
            <svg width="52" height="52" viewBox="0 0 52 52">
                <path d="M26 6 L44 14 L44 38 L26 46 L8 38 L8 14 Z" class="draw-obj" stroke-width="2" fill-opacity="0.8"/>
                <path d="M26 25 L8 14" class="draw-obj" stroke-width="2"/>
                <path d="M26 25 L44 14" class="draw-obj" stroke-width="2"/>
                <path d="M26 25 L26 46" class="draw-obj" stroke-width="2"/>
                
                <line x1="26" y1="2" x2="44" y2="10" class="draw-dim" stroke-width="1"/>
                <text x="35" y="5" text-anchor="middle" font-size="6" class="draw-txt">a</text>
            </svg>
        </div>
        
        <div id="toolbox-label">EQUIP ITEM</div>
    </div>

    <!-- UI State Data Nodes -->
    <div id="info-label"></div>
    <div id="flux-progress">0 / X ENCLOSED</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let renderer, mainScene, mainCamera, controls;
        let hudScene, hudCamera, viewCube;
        let cubeMaterials = [];

        let chargeMesh, chargeMat, fluxPointCharge, referencePlanesGroup = new THREE.Group();
        let fluxChargePos = new THREE.Vector3();

        let currentMode = 'CONSTRUCTION';
        let shapeMode = 'PLANE'; // 'PLANE' OR 'CUBE' (handles logic context dynamically)

        // Arrays maintaining memory references for geometry clears
        let constructionGroup = new THREE.Group(), ringsList = [], oldScales = [], arrowDataList = [];
        let currentBuildStep = 1, currentSetup = 'continuous', currentLinesCount = 24, currentArrowLength = 3.5;
        let targetSphereOpacity = 0.0;

        // Context arrays scaling physics modes dynamically
        let fluxGroup = new THREE.Group(), fluxFieldGroup = new THREE.Group(), hoverHighlightGroup = new THREE.Group();
        let interactiveSlots = [], hoverHighlightMesh;
        
        let holdingEquippedItem = false;
        let placedSquaresCount = 0;
        let requiredSquaresCount = 6;
        
        let isGlowing = false, glowStartTime = 0;
        const clock = new THREE.Clock();

        let mouse = new THREE.Vector2();
        let raycaster = new THREE.Raycaster();
        let isAnimatingCamera = false, targetCameraPos = new THREE.Vector3();
        let activePlaneStr = null, isIsolated = false, showPlanes = true, isolateOnAlign = false;

        const getHudSize = () => window.innerWidth < 600 ? 100 : 130;

        init();

        function init() {
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            mainScene = new THREE.Scene();
            mainCamera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
            mainCamera.position.set(10, 8, 12);

            controls = new OrbitControls(mainCamera, renderer.domElement);
            controls.enableDamping = true; controls.dampingFactor = 0.05;

            mainScene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const pointLight = new THREE.PointLight(0xffffff, 100);
            pointLight.position.set(5, 5, 5);
            mainScene.add(pointLight);

            createCharges();
            createReferencePlanes();

            mainScene.add(constructionGroup);
            mainScene.add(fluxGroup);
            mainScene.add(fluxFieldGroup);
            mainScene.add(hoverHighlightGroup); // Houses adaptive neon dashed boundaries safely

            generateElectricField();

            setupHUD();
            document.fonts.ready.then(() => { updateHUDTextures(); });

            setupUI();

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerdown', onPointerDown);

            animate();
        }

        // --- MESH CORE BUILDING ROUTINES ---
        function createCharges() {
            const chargeGeo = new THREE.SphereGeometry(0.8, 64, 64);
            chargeMat = new THREE.MeshPhysicalMaterial({
                color: 0xaa0000, emissive: 0x440000,
                roughness: 0.2, metalness: 0.1, transparent: true, opacity: 0.0, depthWrite: false
            });
            chargeMesh = new THREE.Mesh(chargeGeo, chargeMat);
            chargeMesh.visible = false;
            mainScene.add(chargeMesh);

            const pointGeo = new THREE.SphereGeometry(0.18, 32, 32);
            const pointMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, emissive: 0xffaa00, emissiveIntensity: 2.5, roughness: 0.1, metalness: 0.8
            });
            fluxPointCharge = new THREE.Mesh(pointGeo, pointMat);
            fluxPointCharge.visible = false;
            mainScene.add(fluxPointCharge);
        }

        function createReferencePlanes() {
            mainScene.add(referencePlanesGroup);
            function addPlane(colorStr, rotationAxis) {
                const group = new THREE.Group();
                const geo = new THREE.PlaneGeometry(12, 12);
                const mat = new THREE.MeshBasicMaterial({ color: colorStr, side: THREE.DoubleSide, transparent: true, opacity: 0.06, depthWrite: false });
                const plane = new THREE.Mesh(geo, mat);
                const grid = new THREE.GridHelper(12, 12, colorStr, colorStr);
                grid.material.opacity = 0.25; grid.material.transparent = true; grid.rotation.x = Math.PI / 2;
                group.add(plane); group.add(grid);
                if (rotationAxis === 'y') group.rotation.y = Math.PI / 2;
                if (rotationAxis === 'x') group.rotation.x = Math.PI / 2;
                referencePlanesGroup.add(group);
            }
            addPlane(0x00aaff, 'z'); addPlane(0xff3333, 'y'); addPlane(0x33ff33, 'x');
        }

        function switchMode(newMode) {
            currentMode = newMode;
            isGlowing = false;
            holdingEquippedItem = false;
            document.getElementById('toolbox').classList.remove('active');
            hoverHighlightGroup.visible = false;

            if (currentMode === 'CONSTRUCTION') {
                shapeMode = 'PLANE';
                
                constructionGroup.visible = true;
                fluxGroup.visible = false;
                fluxFieldGroup.visible = false;
                fluxPointCharge.visible = false;
                updateBuildState();

                document.getElementById('construction-controls').style.display = 'block';
                document.getElementById('isolate-row').style.display = 'flex';
                document.getElementById('toolbox').style.display = 'none';
                document.getElementById('flux-progress').style.display = 'none';
                document.getElementById('info-label').style.display = 'none';
                
                controls.target.set(0, 0, 0);

            } else {
                constructionGroup.visible = false;
                fluxGroup.visible = true;
                fluxFieldGroup.visible = true;
                chargeMesh.visible = false;
                fluxPointCharge.visible = true;

                document.getElementById('construction-controls').style.display = 'none';
                document.getElementById('isolate-row').style.display = 'none';
                document.getElementById('toolbox').style.display = 'flex';
                document.getElementById('flux-progress').style.display = 'block';
                
                const uiInfo = document.getElementById('info-label');
                uiInfo.style.display = 'block';
                
                buildFluxEnvironment(currentMode, uiInfo);
            }
        }

        // --- MATH GEOMETRY DRIVEN VOLUMETRIC SCALING ----
        function buildFluxEnvironment(mode, uiInfo) {
            while (fluxGroup.children.length > 0) fluxGroup.remove(fluxGroup.children[0]);
            while (fluxFieldGroup.children.length > 0) fluxFieldGroup.remove(fluxFieldGroup.children[0]);
            
            interactiveSlots = [];
            placedSquaresCount = 0;

            let sideA, positions = [];

            // Detect & Route Geometry Needs properly contextually
            if (mode.includes("PLATE")) {
                shapeMode = 'PLANE';
                document.getElementById('svg-plate').style.display = 'flex';
                document.getElementById('svg-cube').style.display = 'none';
                document.getElementById('toolbox-label').innerText = "EQUIP SQUARE";
            } else if (mode.includes("CUBE")) {
                shapeMode = 'CUBE';
                document.getElementById('svg-plate').style.display = 'none';
                document.getElementById('svg-cube').style.display = 'flex';
                document.getElementById('toolbox-label').innerText = "EQUIP CUBE";
            }

            // [1] - CLASSIC FLAT ENCLOSURE GAUSSIAN SOLVER //
            if (mode === 'FLUX_CENTER_PLATES') {
                requiredSquaresCount = 6;
                sideA = 4;
                fluxChargePos.set(0, 0, 0);
                
                let d = sideA / 2;
                positions.push({ p: [0,  d,  0], r: [Math.PI/2, 0, 0] });
                positions.push({ p: [0, -d,  0], r: [Math.PI/2, 0, 0] });
                positions.push({ p: [ d, 0,  0], r: [0, Math.PI/2, 0] });
                positions.push({ p: [-d, 0,  0], r: [0, Math.PI/2, 0] });
                positions.push({ p: [0,  0,  d], r: [0, 0, 0] });          
                positions.push({ p: [0,  0, -d], r: [0, 0, 0] });
                
                uiInfo.innerHTML = "CHARGE IS ENCLOSED <i><b>a/2</b></i><br>ABOVE THE PLATE'S CENTRE";
                addGhostVolume(sideA, sideA, sideA, new THREE.Vector3(0, 0, 0));
                
                controls.target.copy(fluxChargePos);
                mainCamera.position.set(10, 7, 10);
                
            } 
            else if (mode === 'FLUX_CORNER_PLATES') {
                requiredSquaresCount = 24;
                sideA = 2.5; 
                let d = sideA; // Center offset puts whole arrangement spanning box 2A bounds 
                fluxChargePos.set(0, sideA, 0); 

                let centers = [-sideA/2, sideA/2]; 
                
                let addFace = (axis, sign) => {
                    centers.forEach(u => { centers.forEach(v => {
                        let pos = new THREE.Vector3(), rot = [0,0,0];
                        if(axis === 'y') { pos.set(u, sign*d, v); rot = [Math.PI/2, 0, 0]; }
                        if(axis === 'x') { pos.set(sign*d, u, v); rot = [0, Math.PI/2, 0]; }
                        if(axis === 'z') { pos.set(u, v, sign*d); rot = [0, 0, 0]; }
                        
                        pos.add(fluxChargePos);
                        positions.push({ p: [pos.x, pos.y, pos.z], r: rot });
                    });});
                };
                addFace('y', 1); addFace('y', -1);
                addFace('x', 1); addFace('x', -1);
                addFace('z', 1); addFace('z', -1);
                
                uiInfo.innerHTML = "CHARGE LIES <i><b>a</b></i> DISTANCE ABOVE<br>THE FLAT SQUARE'S OPEN CORNER";
                addGhostVolume(sideA*2, sideA*2, sideA*2, fluxChargePos);
                
                controls.target.copy(fluxChargePos);
                mainCamera.position.set(14, 11, 14);
            } 

            // [2] - NEW THREE.JS 3D OCTANT GAUSSIAN BLOCK VOLUME LOGIC //
            else if (mode === 'FLUX_FACE_CUBES') {
                requiredSquaresCount = 2; sideA = 4;
                fluxChargePos.set(0, 0, 0);
                
                let offset = sideA / 2; // Split half
                positions.push({ p: [offset, 0, 0], r: [0, 0, 0] });
                positions.push({ p: [-offset, 0, 0], r: [0, 0, 0] });
                
                uiInfo.innerHTML = "CHARGE IS STRADDLED EVENLY ON A SHARED<br><i><b>CENTER FACE</b></i> CONNECTING CUBES";
                addGhostVolume(sideA*2, sideA, sideA, fluxChargePos); // Wide layout bounds guide 
                
                controls.target.copy(fluxChargePos);
                mainCamera.position.set(11, 8, 12);
                
            } else if (mode === 'FLUX_EDGE_CUBES') {
                requiredSquaresCount = 4; sideA = 4;
                fluxChargePos.set(0, 0, 0);
                
                let off = sideA / 2;
                [1,-1].forEach(ux => {
                    [1,-1].forEach(uy => {
                        positions.push({ p: [ux*off, uy*off, 0], r: [0, 0, 0] });
                    });
                });
                
                uiInfo.innerHTML = "CHARGE LIES IN THE <i><b>ABSOLUTE CENTER BORDER</b></i> <br>WHERE 4 DISTINCT BOX EDGES ALIGN";
                addGhostVolume(sideA*2, sideA*2, sideA, fluxChargePos);
                
                controls.target.copy(fluxChargePos);
                mainCamera.position.set(12, 10, 14);
                
            } else if (mode === 'FLUX_CORNER_CUBES') {
                requiredSquaresCount = 8; sideA = 3.5;
                fluxChargePos.set(0, 0, 0);
                
                let off = sideA / 2;
                [1,-1].forEach(ux => {
                    [1,-1].forEach(uy => {
                        [1,-1].forEach(uz => {
                            positions.push({ p: [ux*off, uy*off, uz*off], r: [0, 0, 0] });
                        });
                    });
                });
                
                uiInfo.innerHTML = "8 3D SECTORS IS REQUIRED AROUND AN ABSOLUTE<br>CORNER (ORIGIN VERTICE OF ENVELOPING SPACE)";
                addGhostVolume(sideA*2, sideA*2, sideA*2, fluxChargePos);
                
                controls.target.copy(fluxChargePos);
                mainCamera.position.set(16, 12, 16);
            }

            // Sync visual Point Charge Center coordinate cleanly.
            fluxPointCharge.position.copy(fluxChargePos);

            const numArrows = 75;
            for (let i = 0; i < numArrows; i++) {
                const phi = Math.acos(-1 + (2 * i) / numArrows);
                const theta = Math.sqrt(numArrows * Math.PI) * phi;
                let dir = new THREE.Vector3().setFromSphericalCoords(1, phi, theta);
                
                let pushMag = (mode.includes('CUBE')) ? 0.30 : 0.18; // Reach further cleanly away avoiding clipping Box Mesh internally
                let arrowStartPos = fluxChargePos.clone().add(dir.clone().multiplyScalar(pushMag));
                let arrow = new THREE.ArrowHelper(dir, arrowStartPos, 4.5, 0xaaaaaa, 0.18, 0.05);
                fluxFieldGroup.add(arrow);
            }

            // --- Apply Generated Ghost Coordinates -> Physics Targeting Layer Objects --- //
            const invisTargetGeometry = (shapeMode === 'PLANE')

        // --- ENVELOPING VOLUME GEOMETRY FACTORY --- 
        function addGhostVolume(width, height, depth, originCoordVec3) {
            let boundingGeometryLines = new THREE.EdgesGeometry(new THREE.BoxGeometry(width, height, depth));
            let guidingMat = new THREE.LineBasicMaterial({ color: 0x4466aa, opacity: 0.15, transparent: true, depthWrite: false });

        function regenerateNeonBoundaryTracker(sideRefA) {
            // Drop old tracking container totally. Safest strategy switching between plane math <> volume mapping
            while (hoverHighlightGroup.children.length > 0) hoverHighlightGroup.remove(hoverHighlightGroup.children[0]);
            
            // Build Contextual Math Correct 3D Frame outline

        // --- CONSTRUCTOR & CONTROLS ALIGNMENT FUNCTIONS  (Base logic unmutated mostly) ---- // 
        function generateElectricField() {
            oldScales = ringsList.map(r => r.group.scale.x);
            while (constructionGroup.children.length > 0) constructionGroup.remove(constructionGroup.children[0]);
            arrowDataList = []; ringsList = [];

            const angles = [ 0, Math.PI/2, Math.PI/4, 3*Math.PI/4, Math.PI/8, 3*Math.PI/8, 5*Math.PI/8, 7*Math.PI/8, Math.PI/16, 3*Math.PI/16, 5*Math.PI/16, 7*Math.PI/16, 9*Math.PI/16, 11*Math.PI/16, 13*Math.PI/16, 15*Math.PI/16 ];
            const N = currentLinesCount; const dAlpha = (Math.PI * 2) / N; const R = 0.8; const L = currentArrowLength;
            const pChargeGeo = new THREE.SphereGeometry(0.025, 16, 16);
            const pChargeMatTemplate = new THREE.MeshPhysicalMaterial({ color: 0xffffff, emissive: 0xff1111, transparent: true, opacity: 1 });

            for (let i = 0; i < 16; i++) {
                let theta = angles[i]; let rGroup = new THREE.Group();
                let ringGeo = new THREE.TorusGeometry(R, 0.01, 16, 100);
                let ringMat = new THREE.MeshPhysicalMaterial({ color: 0xff4444, emissive: 0x880000, transparent: true, opacity: 1 });
                let ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.y = theta; rGroup.add(ringMesh);

                let pointCharges = [];
                for (let k = 0; k < N; k++) {
                    let alpha = k * dAlpha;
                    if (i > 0 && Math.abs(Math.cos(alpha)) < 0.001) continue;

                    let localDir = new THREE.Vector3(Math.cos(alpha), Math.sin(alpha), 0);
                    let globalDir = localDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), theta);

                    let pMesh = new THREE.Mesh(pChargeGeo, pChargeMatTemplate.clone());
                    pMesh.position.copy(globalDir.clone().multiplyScalar(R));
                    rGroup.add(pMesh); pointCharges.push(pMesh);

                    let arrowStart = globalDir.clone().multiplyScalar(R + 0.025);
                    let color = 0xffffff, headW = 0.04, headL = 0.15;

                    if (currentSetup === 'continuous') {
                        let arrow = new THREE.ArrowHelper(globalDir, arrowStart, L, color, headL, headW);
                        rGroup.add(arrow); arrowDataList.push({ mesh: arrow, dir: globalDir.clone() });
                    } else {
                        const segments = 3, stepSize = L / segments;
                        for (let s = 0; s < segments; s++) {
                            let arrow = new THREE.ArrowHelper(globalDir,
                                globalDir.clone().multiplyScalar((R + 0.025) + s * stepSize), stepSize * 0.6, color, 0.1, headW);
                            rGroup.add(arrow); arrowDataList.push({ mesh: arrow, dir: globalDir.clone() });
                        }
                    }
                }
                let startScale = oldScales[i] !== undefined ? oldScales[i] : 0.001;
                rGroup.scale.set(startScale, startScale, startScale);
                constructionGroup.add(rGroup);
                ringsList.push({ group: rGroup, ringMesh: ringMesh, pointCharges: pointCharges, targetScale: 0.001, targetOpacity: 1 });
            }
            updateBuildState();
        }

        function updateBuildState() {
            if (currentMode !== 'CONSTRUCTION') return;

                    });

                    // Wrap correctly fitted boundary edge outlines onto explicitly rendered items dropping. 
                    let placedShapeEdgeWrapTracerWireframeDataLayerFactoryOutPutGeneratedFormatScaleLinesObjRefGeometricMathLogScaleStrMathNumVecCoordMeshMapTraceEdgesTraceLineGPolyRefFormatLayoutScaleBaseObjectMathSizeBoundCoord = (shapeMode === 'PLANE')
                        ? new THREE.PlaneGeometry(tgRefTargetObjScaleReferenceNum, tgRefTargetObjScaleReferenceNum)
                        : new THREE.BoxGeometry(tgRefTargetObjScaleReferenceNum, tgRefTargetObjScaleReferenceNum, tgRefTargetObjScaleReferenceNum);

                    let tracerVisualBorderFrameLinesMappedEdgeContextLayerGeometryMathStructureMapOutputPolyGeo = new THREE.EdgesGeometry(placedShapeEdgeWrapTracerWireframeDataLayerFactoryOutPutGeneratedFormatScaleLinesObjRefGeometricMathLogScaleStrMathNumVecCoordMeshMapTraceEdgesTraceLineGPolyRefFormatLayoutScaleBaseObjectMathSizeBoundCoord);
                    let edgeLineTraceMaterialFactoryObjMapLayerBlueLine = new THREE.LineBasicMaterial({ color: 0x44eeff, opacity: 0.8, transparent: true, linewidth: 2 });
                    
                    let finalizedBoundedDropObjectPlacedVisualWrapperTargetGeoMapLayerLinesSolidSysRefObjRenderPolyGraphicOutlineMeshMatrixReferenceDataTraceObjGeom = new THREE.LineSegments(tracerVisualBorderFrameLinesMappedEdgeContextLayerGeometryMathStructureMapOutputPolyGeo, edgeLineTraceMaterialFactoryObjMapLayerBlueLine);

                    finalizedBoundedDropObjectPlacedVisualWrapperTargetGeoMapLayerLinesSolidSysRefObjRenderPolyGraphicOutlineMeshMatrixReferenceDataTraceObjGeom.rotation.copy(hitTargetCoordinateGeometryPlaceholderMemoryTargetRef.rotation);
                    fluxGroup.add(finalizedBoundedDropObjectPlacedVisualWrapperTargetGeoMapLayerLinesSolidSysRefObjRenderPolyGraphicOutlineMeshMatrixReferenceDataTraceObjGeom);
                    
                    // Bind children lines strictly to parent target scale reference target updating for unified matrix glow transforms processing memory matrix!
                    hitTargetCoordinateGeometryPlaceholderMemoryTargetRef.userData.edgeBorderObjTracerWireframeObjectMappedAttachedScaleGeoMatMemLinkSyncRefBindLinkMesh = finalizedBoundedDropObjectPlacedVisualWrapperTargetGeoMapLayerLinesSolidSysRefObjRenderPolyGraphicOutlineMeshMatrixReferenceDataTraceObjGeom;

            if (!isAnimatingCamera && currentMode === 'CONSTRUCTION') { activePlaneStr = null; restoreField(); }

        // --- ENVIRONMENT BASE RENDERING SCALES GRAPHICS MATRIX LOGIC WRAP TRACING OUTCOMES -- // 

        function setupHUD() {
            hudScene = new THREE.Scene();
            hudCamera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
            const faces = [
                { text: 'YZ', bg: '#cc0000' }, { text: 'YZ', bg: '#880000' },
                { text: 'ZX', bg: '#00cc00' }, { text: 'ZX', bg: '#008800' },
                { text: 'XY', bg: '#0088cc' }, { text: 'XY', bg: '#005588' }
            ];
            faces.forEach(face => cubeMaterials.push(createCanvasMaterial(face.text, face.bg)));
            viewCube = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), cubeMaterials);
            hudScene.add(viewCube);
        }

        function createCanvasMaterial(text, bgColor) {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, 256, 256);
            ctx.lineWidth = 12; ctx.strokeStyle = '#ffffff'; ctx.strokeRect(0, 0, 256, 256);
            ctx.fillStyle = '#ffffff'; ctx.font = '65px "LEMON MILK", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(text, 128, 138);
            return new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas) });
        }
        
        function updateHUDTextures() {
            const faces = [ { text: 'YZ', bg: '#cc0000' }, { text: 'YZ', bg: '#880000' }, { text: 'ZX', bg: '#00cc00' }, { text: 'ZX', bg: '#008800' }, { text: 'XY', bg: '#0088cc' }, { text: 'XY', bg: '#005588' } ];
            faces.forEach((f, i) => { const nMat = createCanvasMaterial(f.text, f.bg); if (cubeMaterials[i].map) cubeMaterials[i].map.dispose(); cubeMaterials[i].map = nMat.map; cubeMaterials[i].needsUpdate = true; });
        }

        function setupUI() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('pointerdown', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    switchMode(this.dataset.mode);
                });
            });

            document.getElementById('toggle-btn').addEventListener('click', () => { document.getElementById('panel').classList.toggle('collapsed'); });
            document.getElementById('buildSlider').addEventListener('input', (e) => { currentBuildStep = parseInt(e.target.value); document.getElementById('buildVal').innerText = currentBuildStep; updateBuildState(); });
            document.getElementById('planesToggle').addEventListener('change', (e) => { showPlanes = e.target.checked; referencePlanesGroup.visible = showPlanes; });
            document.getElementById('isolateToggle').addEventListener('change', (e) => { isolateOnAlign = e.target.checked; if (!isolateOnAlign) restoreField(); else if (activePlaneStr && !isAnimatingCamera) applyIsolation(activePlaneStr); });
            document.querySelectorAll('input[name="setupType"]').forEach(r => { r.addEventListener('change', (e) => { currentSetup = e.target.value; generateElectricField(); }); });
            document.getElementById('countSlider').addEventListener('input', (e) => { currentLinesCount = parseInt(e.target.value); document.getElementById('countVal').innerText = currentLinesCount; generateElectricField(); });
            document.getElementById('lengthSlider').addEventListener('input', (e) => { currentArrowLength = parseFloat(e.target.value); generateElectricField(); });
        }

        function handleCubeClick(fI) {
            if (fI === 0 || fI === 1) { activePlaneStr = 'YZ'; targetCameraPos.set(fI === 0 ? 14 : -14, 0, 0); }
            else if (fI === 2 || fI === 3) { activePlaneStr = 'ZX'; targetCameraPos.set(0, fI === 2 ? 14 : -14, 0); }
            else if (fI === 4 || fI === 5) { activePlaneStr = 'XY'; targetCameraPos.set(0, 0, fI === 4 ? 14 : -14); }
            restoreField(); isAnimatingCamera = true; controls.enabled = false;
        }

        function applyIsolation(planeStr) {
            if (currentMode !== 'CONSTRUCTION') return;
            isIsolated = true; if (currentBuildStep === 17) { chargeMat.opacity = 0.2; chargeMat.depthWrite = false; }
            arrowDataList.forEach(item => {
                let s = false;
                if (planeStr === 'XY' && Math.abs(item.dir.z) < 0.01) s = true; if (planeStr === 'YZ' && Math.abs(item.dir.x) < 0.01) s = true; if (planeStr === 'ZX' && Math.abs(item.dir.y) < 0.01) s = true;
                if (s) { item.mesh.visible = true; item.mesh.setColor(new THREE.Color(planeStr === 'XY' ? 0x00aaff : (planeStr === 'YZ' ? 0xff3333 : 0x33ff33))); } else { item.mesh.visible = false; }
            });
        }

        function restoreField() {
            if (currentMode !== 'CONSTRUCTION') return;
            isIsolated = false; if (currentBuildStep === 17) { chargeMat.opacity = 1.0; chargeMat.depthWrite = true; }
            arrowDataList.forEach(item => { item.mesh.visible = true; item.mesh.setColor(new THREE.Color(0xffffff)); });
        }

        function onWindowResize() {
            mainCamera.aspect = window.innerWidth / window.innerHeight; mainCamera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ANIMATOR TICK CYCLE CORE WRAP 
        function animate() {

            if (currentMode === 'CONSTRUCTION') {
                ringsList.forEach(r => {
                    r.group.scale.lerp(new THREE.Vector3(r.targetScale, r.targetScale, r.targetScale), 0.08);
                    r.ringMesh.material.opacity += (r.targetOpacity - r.ringMesh.material.opacity) * 0.1;
                    r.pointCharges.forEach(p => { p.material.opacity += (r.targetOpacity - p.material.opacity) * 0.1; p.material.depthWrite = (p.material.opacity > 0.5); });

            if (isGlowing) {

                                iSlotPlatedItemGeomTraceMatLayerObject.userData.edgeBorderObjTracerWireframeObjectMappedAttachedScaleGeoMatMemLinkSyncRefBindLinkMesh.material.color.set(0x44ddff);
                            }

                }

                if (scaleTargetContextTensionOffsetGlowOutRefBaseOffsetTraceObjColorGradianceLineFlowMappedSolidTargetContextMatLayerOffsetFlow > 0) {
                    let mapLayerBaseCoreColOutRefGenContextPulseFormatLogicScaleGeomGeoObjLayerOut = new THREE.Color(0x00aaff);
                    let targetShiftBaseColMathTraceFlashContextMapSync = new THREE.Color(0xffff00);
                    
                    interactiveSlots.forEach(pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer => {
                        if (pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer.userData.placed) {
                            
                            pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer.material.color.copy(mapLayerBaseCoreColOutRefGenContextPulseFormatLogicScaleGeomGeoObjLayerOut.clone().lerp(targetShiftBaseColMathTraceFlashContextMapSync, scaleTargetContextTensionOffsetGlowOutRefBaseOffsetTraceObjColorGradianceLineFlowMappedSolidTargetContextMatLayerOffsetFlow));
                            
                            pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer.material.emissive = new THREE.Color(0xffff00).multiplyScalar(scaleTargetContextTensionOffsetGlowOutRefBaseOffsetTraceObjColorGradianceLineFlowMappedSolidTargetContextMatLayerOffsetFlow * 1.5); // Drive extreme glow burst matrix solid shape !
                            
                            pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer.material.opacity = 0.50 + scaleTargetContextTensionOffsetGlowOutRefBaseOffsetTraceObjColorGradianceLineFlowMappedSolidTargetContextMatLayerOffsetFlow * 0.40; // Dense opaque pop 
                            
                            pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer.material.needsUpdate = true;
                            
                            // Map child traced explicitly boundary wires properly for perfectly symmetrical burst edge syncing
                            if (pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer.userData.edgeBorderObjTracerWireframeObjectMappedAttachedScaleGeoMatMemLinkSyncRefBindLinkMesh) {
                                pValidGraphicGlowVolumeMapDataLayoutTargetSlotBaseContainer.userData.edgeBorderObjTracerWireframeObjectMappedAttachedScaleGeoMatMemLinkSyncRefBindLinkMesh.material.color.copy(mapLayerBaseCoreColOutRefGenContextPulseFormatLogicScaleGeomGeoObjLayerOut.clone().lerp(targetShiftBaseColMathTraceFlashContextMapSync, scaleTargetContextTensionOffsetGlowOutRefBaseOffsetTraceObjColorGradianceLineFlowMappedSolidTargetContextMatLayerOffsetFlow));
                            }
                        }
                    });
                }
            }

            if (isAnimatingCamera) {
                mainCamera.position.lerp(targetCameraPos, 0.08); mainCamera.lookAt(0, 0, 0);
                if (mainCamera.position.distanceTo(targetCameraPos) < 0.1) {
                    mainCamera.position.copy(targetCameraPos); isAnimatingCamera = false; controls.enabled = true;
                    if (isolateOnAlign) applyIsolation(activePlaneStr);
                }
            } else { controls.update(); }

            hudCamera.position.copy(mainCamera.position).normalize().multiplyScalar(5.5); hudCamera.lookAt(0, 0, 0);

            const hS = getHudSize();
            renderer.setViewport(0, 0, window.innerWidth, window.innerHeight);
            renderer.setScissorTest(false); renderer.clear(); renderer.render(mainScene, mainCamera);

            renderer.clearDepth(); renderer.setScissorTest(true);
            renderer.setScissor(window.innerWidth - hS, window.innerHeight - hS, hS, hS);
            renderer.setViewport(window.innerWidth - hS, window.innerHeight - hS, hS, hS);
            renderer.render(hudScene, hudCamera);
        }
